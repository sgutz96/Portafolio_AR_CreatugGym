<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Product Showcase - Visualizador de Productos</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #F7B801;
            --dark: #1A1A2E;
            --light: #EAEAEA;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
            color: var(--light);
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 30px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ar-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Side Panel */
        .side-panel {
            position: fixed;
            left: 20px;
            top: 100px;
            bottom: 20px;
            width: 320px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            z-index: 90;
            overflow-y: auto;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* Product Cards */
        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .product-card.active {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.1);
        }

        .product-card.active::before {
            transform: scaleX(1);
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 13px;
            opacity: 0.7;
            line-height: 1.4;
        }

        /* Texture Selector */
        .texture-selector {
            animation: fadeIn 0.4s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .texture-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .texture-option {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .texture-option::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .texture-option:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .texture-option.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(247, 184, 1, 0.4);
        }

        .texture-option.active::after {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 360px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            z-index: 90;
            animation: fadeIn 0.5s ease-out 0.4s both;
        }

        .instructions h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .instructions ol {
            padding-left: 20px;
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.8;
        }

        /* AR Button Override */
        #ARButton {
            position: fixed !important;
            bottom: 30px !important;
            right: 30px !important;
            background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
            color: white !important;
            border: none !important;
            padding: 18px 40px !important;
            border-radius: 50px !important;
            font-family: 'Outfit', sans-serif !important;
            font-size: 16px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4) !important;
            transition: all 0.3s ease !important;
            z-index: 200 !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
        }

        #ARButton:hover {
            transform: translateY(-3px) !important;
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.6) !important;
        }

        /* Scrollbar */
        .side-panel::-webkit-scrollbar {
            width: 6px;
        }

        .side-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .side-panel::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .side-panel {
                left: 10px;
                right: 10px;
                width: auto;
                bottom: auto;
                max-height: 60vh;
                top: 90px;
            }

            .instructions {
                display: none;
            }

            .logo {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">AR SHOWCASE</div>
    <div class="ar-status">
        <div class="status-dot"></div>
        <span>Listo para AR</span>
    </div>
</div>

<div class="side-panel">
    <div class="section-title">Productos</div>
    <div class="product-grid" id="productGrid"></div>

    <div class="section-title">Texturas / Colores</div>
    <div class="texture-selector">
        <div class="texture-grid" id="textureGrid"></div>
    </div>
</div>

<div class="instructions">
    <h3>Cómo usar:</h3>
    <ol>
        <li>Selecciona un producto del panel lateral</li>
        <li>Elige una textura o color</li>
        <li>Presiona "Iniciar AR" y apunta tu cámara al suelo</li>
        <li>Toca la pantalla para colocar el producto</li>
    </ol>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Configuración de productos
const products = [
    {
        name: 'Bongo Drum',
        desc: 'Instrumento de percusión tradicional',
        model: 'models/gltf/Bongo/Bongo.gltf',
        scale: 0.01,
        textures: [
            { name: 'Original', color: null },
            { name: 'Madera Clara', color: 0xD4A574 },
            { name: 'Madera Oscura', color: 0x6B4423 },
            { name: 'Rojo', color: 0xCC3333 },
            { name: 'Azul', color: 0x3366CC },
            { name: 'Verde', color: 0x33AA33 }
        ]
    },
    {
        name: 'Árbol Modelo 2',
        desc: 'Decoración natural para espacios',
        model: 'models/gltf/Arbol_2/Arbol_2.gltf',
        scale: 0.5,
        textures: [
            { name: 'Original', color: null },
            { name: 'Verde Oscuro', color: 0x2D5016 },
            { name: 'Verde Claro', color: 0x7CB342 },
            { name: 'Otoño', color: 0xD84315 },
            { name: 'Primavera', color: 0x9CCC65 },
            { name: 'Invernal', color: 0xB0BEC5 }
        ]
    },
    {
        name: 'Árbol Modelo 1',
        desc: 'Elemento decorativo elegante',
        model: 'models/gltf/Arbol_1/Arbol_1.gltf',
        scale: 0.5,
        textures: [
            { name: 'Original', color: null },
            { name: 'Tropical', color: 0x4CAF50 },
            { name: 'Desierto', color: 0xCDDC39 },
            { name: 'Nocturno', color: 0x1B5E20 },
            { name: 'Rosa', color: 0xE91E63 },
            { name: 'Púrpura', color: 0x9C27B0 }
        ]
    }
];

let camera, scene, renderer;
let controller1, controller2;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;

let currentProductIndex = 0;
let currentTextureIndex = 0;
let gltfModels = [];
let loadedModels = 0;

const loader = new GLTFLoader();
const textureLoader = new THREE.TextureLoader();

// Pre-cargar todos los modelos
products.forEach((product, index) => {
    loader.load(product.model, gltf => {
        gltfModels[index] = gltf.scene;
        loadedModels++;
        if (loadedModels === products.length) {
            console.log('Todos los modelos cargados');
        }
    }, undefined, error => {
        console.error(`Error cargando modelo ${product.model}`, error);
    });
});

// Renderizar UI de productos
function renderProductUI() {
    const productGrid = document.getElementById('productGrid');
    productGrid.innerHTML = '';
    
    products.forEach((product, index) => {
        const card = document.createElement('div');
        card.className = `product-card ${index === currentProductIndex ? 'active' : ''}`;
        card.innerHTML = `
            <div class="product-name">${product.name}</div>
            <div class="product-desc">${product.desc}</div>
        `;
        card.onclick = () => selectProduct(index);
        productGrid.appendChild(card);
    });
}

// Renderizar UI de texturas
function renderTextureUI() {
    const textureGrid = document.getElementById('textureGrid');
    textureGrid.innerHTML = '';
    
    const currentProduct = products[currentProductIndex];
    
    currentProduct.textures.forEach((texture, index) => {
        const option = document.createElement('div');
        option.className = `texture-option ${index === currentTextureIndex ? 'active' : ''}`;
        
        if (texture.color) {
            option.style.background = `linear-gradient(135deg, #${texture.color.toString(16).padStart(6, '0')}, #${(texture.color - 0x222222).toString(16).padStart(6, '0')})`;
        } else {
            option.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        }
        
        option.title = texture.name;
        option.onclick = () => selectTexture(index);
        textureGrid.appendChild(option);
    });
}

function selectProduct(index) {
    currentProductIndex = index;
    currentTextureIndex = 0;
    renderProductUI();
    renderTextureUI();
}

function selectTexture(index) {
    currentTextureIndex = index;
    renderTextureUI();
}

// Inicializar UI
renderProductUI();
renderTextureUI();

init();

function init() {
    const container = document.createElement('div');
    document.body.appendChild(container);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
    light.position.set(0.5, 1, 0.25);
    scene.add(light);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
    arButton.id = 'ARButton';
    arButton.textContent = 'Iniciar AR';
    document.body.appendChild(arButton);

    function onSelect() {
        if (reticle.visible && gltfModels[currentProductIndex]) {
            const model = gltfModels[currentProductIndex].clone();
            reticle.matrix.decompose(model.position, model.quaternion, model.scale);
            
            const product = products[currentProductIndex];
            model.scale.set(product.scale, product.scale, product.scale);
            
            // Aplicar textura/color
            const texture = product.textures[currentTextureIndex];
            if (texture.color) {
                model.traverse(child => {
                    if (child.isMesh) {
                        child.material = child.material.clone();
                        child.material.color.setHex(texture.color);
                    }
                });
            }
            
            scene.add(model);
        }
    }

    controller1 = renderer.xr.getController(0);
    controller1.addEventListener('select', onSelect);
    scene.add(controller1);

    controller2 = renderer.xr.getController(1);
    controller2.addEventListener('select', onSelect);
    scene.add(controller2);

    reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xFF6B35 })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    renderer.setAnimationLoop((timestamp, frame) => {
        if (renderer.xr.isPresenting) {
            animate(timestamp, frame);
        } else {
            render();
        }
    });

    renderer.xr.addEventListener('sessionend', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
    });

    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(timestamp, frame) {
    if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then(refSpace => {
                session.requestHitTestSource({ space: refSpace }).then(source => {
                    hitTestSource = source;
                });
            });

            session.addEventListener('end', () => {
                hitTestSourceRequested = false;
                hitTestSource = null;
            });

            hitTestSourceRequested = true;
        }

        if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);

            if (hitTestResults.length) {
                const hit = hitTestResults[0];
                reticle.visible = true;
                reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            } else {
                reticle.visible = false;
            }
        }
    }

    renderer.render(scene, camera);
}

function render() {
    renderer.render(scene, camera);
}
</script>

</body>
</html>
